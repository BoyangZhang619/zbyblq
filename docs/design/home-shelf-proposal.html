<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><title>植物架方案 v2</title>
<style>
  :root{
    --bg:#FBFBFA; --ink1:#151515; --ink2:#3B3B3F; --ink3:#9CA3AF;
    --line:rgba(116,153,201,.07); --grid:34px;
    --wood:#B9A98E;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#E8E8EC;display:flex;gap:32px;padding:32px;
       font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .phone{width:390px;height:844px;background:var(--bg);border-radius:44px;overflow:hidden;
    position:relative;box-shadow:0 20px 50px rgba(0,0,0,.18);
    background-image:linear-gradient(var(--line) 1px,transparent 1px),
                     linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:var(--grid) var(--grid)}
  .scroll{position:absolute;inset:0;overflow-y:auto;padding:0 0 118px}
  .scroll::-webkit-scrollbar{display:none}

  .head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 0}
  .brand{font-size:19px;font-weight:700;letter-spacing:-.4px;color:var(--ink1)}
  .acts{display:flex;gap:10px}
  .iconbtn{width:40px;height:40px;border-radius:50%;background:#fff;border:0;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 2px rgba(40,40,45,.05),0 2px 8px rgba(40,40,45,.06)}

  .intro{text-align:center;padding:10px 24px 2px}
  .intro svg{width:112px;height:112px;display:block;margin:0 auto}
  .intro h1{font-size:20px;margin:4px 0 0;color:var(--ink1);letter-spacing:-.2px}
  .intro p{margin:3px 0 0;font-size:12.5px;color:var(--ink3)}

  .shelfblock{padding:26px 0 0}
  .shelfname{font-size:12.5px;color:var(--ink3);letter-spacing:.6px;padding:0 32px 6px}

  /* 结构：植物坐在板上 → 板 → 标签在板沿下方
     用 grid 保证标签与植物严格对齐（flex 的 space-around 在不同宽度下会错位） */
  .shelf{padding:0 20px}
  .row,.names{display:grid;grid-template-columns:repeat(var(--n,3),1fr);justify-items:center}
  .row{align-items:end;min-height:132px}
  .item{cursor:pointer;display:flex;align-items:flex-end;justify-content:center}

  /* 搁板：三层叠加做出木板厚度 */
  .board{position:relative;height:8px;margin:0 -4px;
    background:linear-gradient(180deg,#C6B79C 0%,#B9A98E 45%,#9C8B70 100%);
    border-radius:4px;box-shadow:0 3px 7px rgba(120,105,84,.22)}
  .board::before{content:'';position:absolute;left:4px;right:4px;top:-3px;height:3px;
    background:#D8CBB4;border-radius:3px}

  .names{padding-top:7px}
  .names span{font-size:11.5px;color:var(--ink2);white-space:nowrap}

  /* 尺寸错落：非标准化排列 */
  .s1 svg{width:52px;height:76px}
  .s2 svg{width:44px;height:64px}
  .s3 svg{width:60px;height:88px}
  .s4 svg{width:48px;height:70px}

  .nav{position:absolute;left:20px;right:20px;bottom:22px;height:64px;
    background:rgba(255,255,255,.86);backdrop-filter:blur(12px);border-radius:32px;
    display:flex;align-items:center;justify-content:space-around;
    box-shadow:0 2px 6px rgba(40,40,45,.06),0 10px 28px rgba(40,40,45,.12)}
  .nav .it{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .nav .it.on{background:rgba(0,0,0,.06)}
  .label{text-align:center;font-size:12px;color:#6b6b73;margin:10px 0 0;letter-spacing:.3px}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute"><defs>
  <!-- 通用花盆：梯形 + 盆沿 -->
  <symbol id="pot" viewBox="0 0 60 34">
    <path d="M8 8 H52 L47 30 C46.6 32 45 33 43 33 H17 C15 33 13.4 32 13 30 Z"
          fill="#D9A87C" stroke="#2E3B2A" stroke-width="4" stroke-linejoin="round"/>
    <path d="M5 8 H55 V11.5 H5 Z" fill="#C48F63" stroke="#2E3B2A" stroke-width="4" stroke-linejoin="round"/>
  </symbol>

  <!-- 1 阔叶：大叶片 + 叶柄 -->
  <symbol id="p-leaf" viewBox="0 0 80 120">
    <use href="#pot" x="10" y="86" width="60" height="34"/>
    <g stroke="#2E3B2A" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M40 90 C40 74 40 62 41 52" fill="none"/>
      <path d="M41 54 C22 52 8 38 8 18 C28 14 42 30 41 54 Z" fill="#3E7A6B"/>
      <path d="M41 54 C60 52 74 38 74 18 C54 14 40 30 41 54 Z" fill="#5FA391"/>
      <path d="M41 54 C36 38 34 24 36 10 C46 16 50 34 41 54 Z" fill="#7FBFAD"/>
      <path d="M40 86 L40 60 M40 70 L28 62 M40 76 L52 68" fill="none" stroke-width="3"/>
    </g>
  </symbol>

  <!-- 2 蕨：两枝拱形羽叶 -->
  <symbol id="p-fern" viewBox="0 0 80 120">
    <use href="#pot" x="10" y="86" width="60" height="34"/>
    <g stroke="#2E3B2A" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M38 88 C30 66 22 46 12 30" fill="none"/>
      <path d="M44 88 C50 66 58 44 70 26" fill="none"/>
      <g fill="#7A9E3E">
        <path d="M14 34 C6 30 0 32 -2 37 C5 41 12 40 14 34 Z"/>
        <path d="M19 44 C10 40 3 42 1 48 C9 52 17 51 19 44 Z"/>
        <path d="M25 55 C16 51 9 53 7 59 C15 63 23 62 25 55 Z"/>
        <path d="M31 67 C23 63 16 65 14 71 C22 75 30 74 31 67 Z"/>
      </g>
      <g fill="#A8C46B">
        <path d="M66 30 C74 26 80 28 82 33 C75 37 68 36 66 30 Z"/>
        <path d="M61 40 C70 36 77 38 79 44 C71 48 63 47 61 40 Z"/>
        <path d="M55 51 C64 47 71 49 73 55 C65 59 57 58 55 51 Z"/>
        <path d="M49 63 C57 59 64 61 66 67 C58 71 50 70 49 63 Z"/>
      </g>
    </g>
  </symbol>

  <!-- 3 花：五瓣不等分 -->
  <symbol id="p-flower" viewBox="0 0 80 120">
    <use href="#pot" x="10" y="86" width="60" height="34"/>
    <g stroke="#2E3B2A" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M40 88 C40 74 40 60 40 48" fill="none"/>
      <path d="M40 74 C28 70 18 72 14 79 C24 86 36 84 40 74 Z" fill="#6B9E6B"/>
      <path d="M40 62 C52 58 62 60 66 67 C56 74 44 72 40 62 Z" fill="#9ECB8A"/>
      <path d="M30 30 C24 14 32 4 44 6 C56 8 62 20 58 34
               C72 32 80 42 78 54 C76 66 64 72 52 68
               C54 82 44 92 32 90 C20 88 14 76 20 64
               C8 66 -2 56 0 44 C2 32 16 26 30 30 Z" fill="#E8909F"/>
      <circle cx="40" cy="48" r="13" fill="#FFD84F"/>
      <path d="M40 41 L40 55 M33 48 L47 48" fill="none" stroke-width="3"/>
    </g>
  </symbol>

  <!-- 4 芽：两片初叶，不对称 -->
  <symbol id="p-sprout" viewBox="0 0 80 120">
    <use href="#pot" x="10" y="86" width="60" height="34"/>
    <g stroke="#2E3B2A" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M40 88 C40 76 40 64 41 56" fill="none"/>
      <path d="M41 58 C41 40 30 26 14 22 C8 40 20 58 41 58 Z" fill="#C3DC7A"/>
      <path d="M41 58 C41 36 55 22 74 18 C80 40 64 58 41 58 Z" fill="#9ECB8A"/>
    </g>
  </symbol>

  <!-- 5 莲座：外层摊开 + 内层立起 -->
  <symbol id="p-rosette" viewBox="0 0 80 120">
    <use href="#pot" x="10" y="86" width="60" height="34"/>
    <g stroke="#2E3B2A" stroke-width="3.4" stroke-lineapp="round" stroke-linecap="round" stroke-linejoin="round">
      <path d="M40 86 C14 84 2 68 6 50 C10 34 24 26 40 26 C56 26 70 34 74 50 C78 68 66 84 40 86 Z" fill="#7FA8A0"/>
      <path d="M40 84 C22 80 16 64 20 50 C24 38 32 32 40 32 C48 32 56 38 60 50 C64 64 58 80 40 84 Z" fill="#5E9490"/>
      <path d="M40 82 C30 76 28 62 32 50 C35 42 38 38 40 38 C42 38 45 42 48 50 C52 62 50 76 40 82 Z" fill="#41766F"/>
      <path d="M40 80 C36 74 36 64 40 56 C44 64 44 74 40 80 Z" fill="#B5D4C8"/>
    </g>
  </symbol>

  <!-- 6 藤蔓：从盆沿垂落 -->
  <symbol id="p-vine" viewBox="0 0 80 120">
    <use href="#pot" x="10" y="86" width="60" height="34"/>
    <g stroke="#2E3B2A" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M40 88 C38 72 44 58 40 44 C37 32 30 24 22 20" fill="none"/>
      <path d="M40 88 C44 76 36 64 42 52" fill="none"/>
      <path d="M30 34 C18 32 10 38 10 48 C22 52 30 44 30 34 Z" fill="#8FB44F"/>
      <path d="M36 22 C28 14 18 14 12 20 C20 30 32 30 36 22 Z" fill="#6B9E6B"/>
      <path d="M44 50 C56 48 64 54 64 64 C52 68 44 60 44 50 Z" fill="#C3DC7A"/>
      <path d="M60 96 C66 104 76 106 82 100 C76 92 66 90 60 96 Z" fill="#9ECB8A"/>
    </g>
  </symbol>

  <!-- 主视觉：三枝错落 -->
  <symbol id="p-hero" viewBox="0 0 160 160">
    <use href="#pot" x="50" y="118" width="60" height="34"/>
    <g stroke="#2E3B2A" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M80 122 C80 96 80 72 80 52" fill="none"/>
      <path d="M80 88 C56 84 38 68 34 46 C58 42 76 58 80 88 Z" fill="#6B9E6B"/>
      <path d="M80 88 C104 84 122 68 126 46 C102 42 84 58 80 88 Z" fill="#9ECB8A"/>
      <path d="M80 54 C68 36 68 16 80 2 C92 16 92 36 80 54 Z" fill="#C3DC7A"/>
      <path d="M80 60 L80 100" fill="none" stroke-width="3.4"/>
    </g>
  </symbol>
</defs></svg>

<div class="phone">
  <div class="scroll">
    <div class="head">
      <div class="brand">『ZBYBLQ』</div>
      <div class="acts">
        <button class="iconbtn"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#3B3B3F" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 14.4A8.6 8.6 0 0 1 9.6 3.8a8.6 8.6 0 1 0 10.6 10.6Z"/></svg></button>
        <button class="iconbtn"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#3B3B3F" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20.5c0-3.7 3.1-6.6 7-6.6s7 2.9 7 6.6"/></svg></button>
      </div>
    </div>

    <div class="intro">
      <svg><use href="#p-hero"/></svg>
      <h1>个人工具合集</h1>
      <p>12 个自用的小工具</p>
    </div>

    <div class="shelfblock">
      <div class="shelfname">算法</div>
      <div class="shelf">
        <div class="row" style="--n:3">
        <div class="item s3"><svg><use href="#p-fern"/></svg></div>
        <div class="item s2"><svg><use href="#p-sprout"/></svg></div>
        <div class="item s1"><svg><use href="#p-vine"/></svg></div>
        </div>
        <div class="board"></div>
        <div class="names" style="--n:3">
        <span>二叉树</span>
        <span>排序算法</span>
        <span>路径寻找</span>
        </div>
      </div>
    </div>

    <div class="shelfblock">
      <div class="shelfname">图像</div>
      <div class="shelf">
        <div class="row" style="--n:4">
        <div class="item s2"><svg><use href="#p-rosette"/></svg></div>
        <div class="item s3"><svg><use href="#p-flower"/></svg></div>
        <div class="item s4"><svg><use href="#p-leaf"/></svg></div>
        <div class="item s1"><svg><use href="#p-vine"/></svg></div>
        </div>
        <div class="board"></div>
        <div class="names" style="--n:4">
        <span>像素化</span>
        <span>图片混淆</span>
        <span>转 ASCII</span>
        <span>包浆</span>
        </div>
      </div>
    </div>

    <div class="shelfblock">
      <div class="shelfname">音乐</div>
      <div class="shelf">
        <div class="row" style="--n:3">
        <div class="item s2"><svg><use href="#p-sprout"/></svg></div>
        <div class="item s1"><svg><use href="#p-flower"/></svg></div>
        <div class="item s3"><svg><use href="#p-fern"/></svg></div>
        </div>
        <div class="board"></div>
        <div class="names" style="--n:3">
        <span>鼓机</span>
        <span>拇指琴</span>
        <span>钢琴</span>
        </div>
      </div>
    </div>
  </div>

  <div class="nav">
    <div class="it on"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#151515" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.2 12 4l8 6.2V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z"/><path d="M9.5 20.5v-6h5v6"/></svg></div>
    <div class="it"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6.6" height="6.6" rx="2.2"/><rect x="13.4" y="4" width="6.6" height="6.6" rx="2.2"/><rect x="4" y="13.4" width="6.6" height="6.6" rx="2.2"/><rect x="13.4" y="13.4" width="6.6" height="6.6" rx="2.2"/></svg></div>
    <div class="it"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20.5c0-3.7 3.1-6.6 7-6.6s7 2.9 7 6.6"/></svg></div>
  </div>
</div>
<div class="label">植物架方案 v2</div>

</body>
</html>
