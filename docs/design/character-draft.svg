<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!--
    角色草稿 v2
    v1 的问题：五官过低过散、两眼大小接近、描边过细、轮廓太圆
    v2 调整：五官上移收紧、右眼缩为小点、描边加粗、轮廓增加不规则度
  -->
  <g>
    <!-- 主体：更不规则的手绘 blob -->
    <path
      d="M148 30
         C180 24, 214 40, 236 68
         C254 91, 272 108, 271 136
         C270 162, 248 180, 240 206
         C230 238, 208 262, 176 269
         C146 276, 114 264, 92 243
         C66 219, 32 202, 28 170
         C24 137, 44 108, 60 84
         C78 57, 116 36, 148 30 Z"
      fill="#FFD84F" stroke="#2B2B2B" stroke-width="6" stroke-linejoin="round" />

    <!-- 右眼：小圆点 -->
    <path d="M186 104 C192 104, 196 109, 196 115 C196 121, 191 126, 185 125 C179 124, 176 119, 177 113 C178 108, 181 104, 186 104 Z"
          fill="#2B2B2B" />

    <!-- 左眼：倾斜豆形，明显大于右眼 -->
    <path d="M112 112 C122 103, 138 104, 145 114 C152 124, 149 139, 139 145 C129 151, 114 148, 108 138 C102 128, 103 120, 112 112 Z"
          fill="#2B2B2B" />
    <!-- 眼神光 -->
    <path d="M120 117 C125 114, 130 117, 130 122 C130 127, 126 130, 122 130 C118 130, 115 126, 115 122 C115 119, 117 117, 120 117 Z"
          fill="#FFD84F" />

    <!-- 嘴巴：紧凑的弧线 -->
    <path d="M128 156 C140 176, 172 176, 184 156"
          fill="none" stroke="#2B2B2B" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round" />

    <!-- 腮红 -->
    <ellipse cx="100" cy="152" rx="13" ry="7" fill="#F0A868" opacity="0.5" />
    <ellipse cx="212" cy="150" rx="13" ry="7" fill="#F0A868" opacity="0.5" />
  </g>
</svg>
