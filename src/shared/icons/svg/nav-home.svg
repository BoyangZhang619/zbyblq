<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <!--
    小屋。
    改进点（原版是标准的两笔房子，平淡）：
    1. 屋顶顶部收成圆角，而非尖角——与全站的柔和调性一致
    2. 屋顶向两侧出檐（3.4 与 20.6 超出墙体 5.3 与 18.7），房子才立得住
    3. 门改为拱形，比方门更有居住感
    4. 墙体与屋顶在 y≈9.4 处交叠，靠描边宽度自然衔接，不留缝
  -->
  <path d="M3.4 10.8 11.2 4.2a1.15 1.15 0 0 1 1.6 0l7.8 6.6"/>
  <path d="M5.3 9.5v9.8A1.7 1.7 0 0 0 7 21h10a1.7 1.7 0 0 0 1.7-1.7V9.5"/>
  <path d="M9.9 21v-4.4a2.1 2.1 0 0 1 4.2 0V21"/>
</svg>
