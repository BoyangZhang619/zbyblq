<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <!--
    手帐纸纹：细密噪点，用于页面背景与卡片表面的质感叠加。

    使用约束（见 docs/03-design-system.md §6.1）：
    - 不透明度不超过 0.05，否则会显脏
    - 必须 pointer-events: none，不得拦截交互
    - 深色主题下改用 screen 混合模式或直接关闭

    stitchTiles="stitch" 保证平铺时接缝无痕。
  -->
  <filter id="paperGrain">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.9"
      numOctaves="4"
      stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <rect width="140" height="140" filter="url(#paperGrain)" />
</svg>
